apiVersion: 1

groups:
  - orgId: 1
    name: hotshop-local-demo
    folder: HotShop
    interval: 1m
    rules:
      - uid: hotshop-target-down-local
        title: HotShop target down (local demo)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: 'max(up{job=~"portal|admin|task|agent"} == 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: C
              type: reduce
        noDataState: OK
        execErrState: Error
        for: 30s
        annotations:
          summary: Local demo application target is unavailable
          description: This intentionally sensitive threshold is not a production SLO.
        labels:
          severity: critical
          scope: local-demo
