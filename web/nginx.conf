server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /agent-api/ {
        proxy_pass http://agent-service:8090/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }

    location /admin/api/ {
        proxy_pass http://admin-service:8088;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://portal-service:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }

    location /provider-callbacks/ {
        proxy_pass http://portal-service:8080;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
