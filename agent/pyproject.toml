[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hotshop-agent"
version = "0.1.0"
description = "Independent HotShop Agent process"
requires-python = "==3.12.*"
dependencies = [
  "cryptography==45.0.4",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "langgraph==0.4.8",
  "prometheus-client==0.22.1",
  "pydantic-settings==2.9.1",
  "PyJWT==2.10.1",
  "redis==6.2.0",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hotshop_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["qdrant: requires a real Qdrant container"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hotshop_agent"]
