global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    deployment_environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: portal
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [portal-service:8080]
  - job_name: admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [admin-service:8088]
  - job_name: task
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [task-service:8888]
  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: [agent-service:8090]
  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: [alloy:12345]
