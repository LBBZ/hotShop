# Rebuildable cache/session/rate-limit data. RDB provides restart continuity,
# while allkeys-lfu allows bounded memory use under cache pressure.
bind 0.0.0.0
protected-mode yes
port 6379
databases 1
dir /data

maxmemory 256mb
maxmemory-policy allkeys-lfu

appendonly no
save 3600 1
save 300 100
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
