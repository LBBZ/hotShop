# Reservation, idempotency, and Redis Stream state must never be evicted.
# AOF is the primary durability path and uses an RDB preamble; periodic RDB
# snapshots remain enabled as an independent recovery/checkpoint mechanism.
bind 0.0.0.0
protected-mode yes
port 6379
databases 1
dir /data

maxmemory 512mb
maxmemory-policy noeviction

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
