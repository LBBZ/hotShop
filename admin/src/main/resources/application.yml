spring:
  application:
    name: admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  config:
    import:
      - classpath:config/common-db.yml
      - classpath:config/common-redis.yml
      - classpath:config/common-jwt.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotShop?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

rabbitmq:
  enabled : false

server:
  port: 8088

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
    version: openapi_3_1

logging:
  level:
    org.springframework.security: INFO
    com.real: INFO
    com.real.domain.mapper: WARN
