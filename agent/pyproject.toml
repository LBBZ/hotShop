[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hotshop-agent"
version = "0.1.0"
description = "HotShop shopping assistant with authorized commerce tools and cited knowledge retrieval"
requires-python = "==3.12.*"
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "langgraph==1.2.12",
  "prometheus-client==0.26.0",
  "pydantic-settings==2.15.0",
  "PyJWT==2.15.1",
  "redis==8.1.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.2.1",
  "ruff==0.11.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hotshop_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["qdrant: requires a real Qdrant container", "redis: requires an isolated Redis test container"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hotshop_agent"]
