name: ${COMPOSE_PROJECT_NAME:-hotshop}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.46}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=${MYSQL_TIME_ZONE:-+00:00}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-300}
      - --performance-schema=ON
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=${MYSQL_SLOW_QUERY_SECONDS:-1}
      - --log-error-verbosity=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotShop}
      TZ: ${TZ:-UTC}
    ports:
      - "${MYSQL_PORT:-4306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/data:/opt/hotshop/data:ro
    networks:
      - hotShop-network
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user=root --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1g}
    cpus: ${MYSQL_CPU_LIMIT:-1.5}
    stop_grace_period: 1m
    restart: unless-stopped

  database-migrator:
    image: ${FLYWAY_IMAGE:-flyway/flyway:11.20.3-alpine}
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hotShop}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-mysql}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 20
      FLYWAY_CONNECT_RETRIES_INTERVAL: 5
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_FAIL_ON_MISSING_LOCATIONS: "true"
      FLYWAY_OUT_OF_ORDER: "false"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    volumes:
      - ./database/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hotShop-network
    restart: "no"

  redis-cache:
    image: ${REDIS_IMAGE:-redis:8.8.1-alpine}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:-change-me-local-redis-cache}
    environment:
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:-change-me-local-redis-cache}
      TZ: ${TZ:-UTC}
    ports:
      - "${REDIS_CACHE_PORT:-7379}:6379"
    volumes:
      - ./docker/redis/cache.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cache_data:/data
    networks:
      - hotShop-network
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(redis-cli --raw ping)" = PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: ${REDIS_CACHE_MEMORY_LIMIT:-384m}
    restart: unless-stopped

  redis-seckill:
    image: ${REDIS_IMAGE:-redis:8.8.1-alpine}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_SECKILL_PASSWORD:-change-me-local-redis-seckill}
    environment:
      REDISCLI_AUTH: ${REDIS_SECKILL_PASSWORD:-change-me-local-redis-seckill}
      TZ: ${TZ:-UTC}
    ports:
      - "${REDIS_SECKILL_PORT:-7380}:6379"
    volumes:
      - ./docker/redis/seckill.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_seckill_data:/data
    networks:
      - hotShop-network
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(redis-cli --raw ping)" = PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: ${REDIS_SECKILL_MEMORY_LIMIT:-640m}
    stop_grace_period: 30s
    restart: unless-stopped

  rabbitmq:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
      args:
        RABBITMQ_IMAGE: ${RABBITMQ_IMAGE:-rabbitmq:4.0.7-management-alpine}
    image: ${RABBITMQ_PROJECT_IMAGE:-hotshop-rabbitmq:4.0.7}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-hotshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me-local-rabbitmq}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      TZ: ${TZ:-UTC}
    ports:
      - "${RABBITMQ_AMQP_PORT:-6672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hotShop-network
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-768m}
    stop_grace_period: 1m
    restart: unless-stopped

  admin-service:
    profiles: [app]
    build:
      context: .
      args:
        MODULE: admin
        PROFILE: ${SPRING_PROFILES_ACTIVE:-}
    image: ${ADMIN_IMAGE:-hotshop-admin:local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hotShop}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-mysql}
      HOTSHOP_REDIS_CACHE_HOST: redis-cache
      HOTSHOP_REDIS_CACHE_PORT: 6379
      HOTSHOP_REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:-change-me-local-redis-cache}
      HOTSHOP_REDIS_CACHE_TIMEOUT: ${HOTSHOP_REDIS_CACHE_TIMEOUT:-2s}
      HOTSHOP_REDIS_SECKILL_HOST: redis-seckill
      HOTSHOP_REDIS_SECKILL_PORT: 6379
      HOTSHOP_REDIS_SECKILL_PASSWORD: ${REDIS_SECKILL_PASSWORD:-change-me-local-redis-seckill}
      HOTSHOP_REDIS_SECKILL_TIMEOUT: ${HOTSHOP_REDIS_SECKILL_TIMEOUT:-2s}
      HOTSHOP_SECKILL_ACTIVITY_RETENTION: ${HOTSHOP_SECKILL_ACTIVITY_RETENTION:-7d}
      HOTSHOP_ADMIN_PRIVATE_KEY_PATH: /run/secrets/hotshop/administrator-private.pem
      HOTSHOP_ADMIN_PUBLIC_KEY_PATH: /run/secrets/hotshop/administrator-public.pem
      HOTSHOP_SECURE_COOKIES: ${HOTSHOP_SECURE_COOKIES:-true}
      HOTSHOP_JWT_CLOCK_SKEW_SECONDS: ${HOTSHOP_JWT_CLOCK_SKEW_SECONDS:-30}
      HOTSHOP_ADMIN_ACCESS_TTL_SECONDS: ${HOTSHOP_ADMIN_ACCESS_TTL_SECONDS:-900}
      HOTSHOP_REFRESH_TTL_SECONDS: ${HOTSHOP_REFRESH_TTL_SECONDS:-604800}
      HOTSHOP_TRUST_FORWARDED_HEADERS: ${HOTSHOP_TRUST_FORWARDED_HEADERS:-false}
      HOTSHOP_TRUSTED_PROXY_ADDRESSES: ${HOTSHOP_TRUSTED_PROXY_ADDRESSES:-}
      SERVER_PORT: 8088
      TZ: ${TZ:-UTC}
    volumes:
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/administrator-private.pem:/run/secrets/hotshop/administrator-private.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/administrator-public.pem:/run/secrets/hotshop/administrator-public.pem:ro
    ports:
      - "${ADMIN_PORT:-8088}:8088"
    depends_on:
      database-migrator:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-seckill:
        condition: service_healthy
    networks:
      - hotShop-network

  portal-service:
    profiles: [app]
    build:
      context: .
      args:
        MODULE: portal
        PROFILE: ${SPRING_PROFILES_ACTIVE:-}
    image: ${PORTAL_IMAGE:-hotshop-portal:local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hotShop}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-mysql}
      HOTSHOP_REDIS_CACHE_HOST: redis-cache
      HOTSHOP_REDIS_CACHE_PORT: 6379
      HOTSHOP_REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:-change-me-local-redis-cache}
      HOTSHOP_REDIS_CACHE_TIMEOUT: ${HOTSHOP_REDIS_CACHE_TIMEOUT:-2s}
      HOTSHOP_REDIS_SECKILL_HOST: redis-seckill
      HOTSHOP_REDIS_SECKILL_PORT: 6379
      HOTSHOP_REDIS_SECKILL_PASSWORD: ${REDIS_SECKILL_PASSWORD:-change-me-local-redis-seckill}
      HOTSHOP_REDIS_SECKILL_TIMEOUT: ${HOTSHOP_REDIS_SECKILL_TIMEOUT:-2s}
      HOTSHOP_SECKILL_RESERVATION_TTL: ${HOTSHOP_SECKILL_RESERVATION_TTL:-7d}
      HOTSHOP_SECKILL_IDEMPOTENCY_TTL: ${HOTSHOP_SECKILL_IDEMPOTENCY_TTL:-24h}
      HOTSHOP_SECKILL_ACTIVITY_RETENTION: ${HOTSHOP_SECKILL_ACTIVITY_RETENTION:-7d}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-hotshop}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me-local-rabbitmq}
      HOTSHOP_USER_PRIVATE_KEY_PATH: /run/secrets/hotshop/user-private.pem
      HOTSHOP_USER_PUBLIC_KEY_PATH: /run/secrets/hotshop/user-public.pem
      HOTSHOP_AGENT_DELEGATION_PRIVATE_KEY_PATH: /run/secrets/hotshop/agent-delegation-private.pem
      HOTSHOP_AGENT_DELEGATION_PUBLIC_KEY_PATH: /run/secrets/hotshop/agent-delegation-public.pem
      HOTSHOP_AGENT_SERVICE_PUBLIC_KEY_PATH: /run/secrets/hotshop/agent-service-public.pem
      HOTSHOP_SECURE_COOKIES: ${HOTSHOP_SECURE_COOKIES:-true}
      HOTSHOP_JWT_CLOCK_SKEW_SECONDS: ${HOTSHOP_JWT_CLOCK_SKEW_SECONDS:-30}
      HOTSHOP_USER_ACCESS_TTL_SECONDS: ${HOTSHOP_USER_ACCESS_TTL_SECONDS:-900}
      HOTSHOP_AGENT_DELEGATION_TTL_SECONDS: ${HOTSHOP_AGENT_DELEGATION_TTL_SECONDS:-300}
      HOTSHOP_AGENT_ASSERTION_MAX_TTL_SECONDS: ${HOTSHOP_AGENT_ASSERTION_MAX_TTL_SECONDS:-60}
      HOTSHOP_REFRESH_TTL_SECONDS: ${HOTSHOP_REFRESH_TTL_SECONDS:-604800}
      HOTSHOP_TRUST_FORWARDED_HEADERS: ${HOTSHOP_TRUST_FORWARDED_HEADERS:-false}
      HOTSHOP_TRUSTED_PROXY_ADDRESSES: ${HOTSHOP_TRUSTED_PROXY_ADDRESSES:-}
      SERVER_PORT: 8080
      TZ: ${TZ:-UTC}
    volumes:
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/user-private.pem:/run/secrets/hotshop/user-private.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/user-public.pem:/run/secrets/hotshop/user-public.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/agent-delegation-private.pem:/run/secrets/hotshop/agent-delegation-private.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/agent-delegation-public.pem:/run/secrets/hotshop/agent-delegation-public.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/agent-service-public.pem:/run/secrets/hotshop/agent-service-public.pem:ro
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    depends_on:
      database-migrator:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-seckill:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hotShop-network

  task-service:
    profiles: [app]
    build:
      context: .
      args:
        MODULE: task
        PROFILE: ${SPRING_PROFILES_ACTIVE:-}
    image: ${TASK_IMAGE:-hotshop-task:local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hotShop}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-mysql}
      HOTSHOP_REDIS_CACHE_HOST: redis-cache
      HOTSHOP_REDIS_CACHE_PORT: 6379
      HOTSHOP_REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:-change-me-local-redis-cache}
      HOTSHOP_REDIS_CACHE_TIMEOUT: ${HOTSHOP_REDIS_CACHE_TIMEOUT:-2s}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-hotshop}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me-local-rabbitmq}
      SERVER_PORT: 8888
      TZ: ${TZ:-UTC}
    ports:
      - "${TASK_PORT:-8888}:8888"
    depends_on:
      database-migrator:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hotShop-network

  agent-service:
    profiles: [agent]
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: ${AGENT_IMAGE:-hotshop-agent:local}
    environment:
      AGENT_ENVIRONMENT: ${AGENT_ENVIRONMENT:-local}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-fake}
      AGENT_STATE_BACKEND: redis
      AGENT_REDIS_URL: redis://:${REDIS_CACHE_PASSWORD:-change-me-local-redis-cache}@redis-cache:6379/0
      AGENT_REDIS_KEY_PREFIX: "hotshop:agent:"
      AGENT_SESSION_TTL_SECONDS: ${AGENT_SESSION_TTL_SECONDS:-3600}
      AGENT_RUN_TTL_SECONDS: ${AGENT_RUN_TTL_SECONDS:-900}
      AGENT_PORTAL_BASE_URL: http://portal-service:8080
      AGENT_TOKEN_EXCHANGE_TIMEOUT_SECONDS: ${AGENT_TOKEN_EXCHANGE_TIMEOUT_SECONDS:-3}
      AGENT_ASSERTION_PRIVATE_KEY_PATH: /run/secrets/hotshop/agent-service-private.pem
      AGENT_USER_PUBLIC_KEYS: '{"user-local-1":"/run/secrets/hotshop/user-public.pem"}'
      AGENT_ADMINISTRATOR_PUBLIC_KEYS: '{"administrator-local-1":"/run/secrets/hotshop/administrator-public.pem"}'
      AGENT_DELEGATION_PUBLIC_KEYS: '{"agent-delegation-local-1":"/run/secrets/hotshop/agent-delegation-public.pem"}'
      AGENT_QWEN_API_KEY: ${AGENT_QWEN_API_KEY:-}
      AGENT_QWEN_BASE_URL: ${AGENT_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AGENT_QWEN_MODEL: ${AGENT_QWEN_MODEL:-qwen-plus}
      AGENT_QWEN_INPUT_COST_PER_MILLION_USD: ${AGENT_QWEN_INPUT_COST_PER_MILLION_USD:-0}
      AGENT_QWEN_OUTPUT_COST_PER_MILLION_USD: ${AGENT_QWEN_OUTPUT_COST_PER_MILLION_USD:-0}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-15}
      AGENT_MODEL_MAX_RETRIES: ${AGENT_MODEL_MAX_RETRIES:-2}
      AGENT_CIRCUIT_FAILURE_THRESHOLD: ${AGENT_CIRCUIT_FAILURE_THRESHOLD:-3}
      AGENT_CIRCUIT_RECOVERY_SECONDS: ${AGENT_CIRCUIT_RECOVERY_SECONDS:-30}
      AGENT_GLOBAL_CONCURRENCY_LIMIT: ${AGENT_GLOBAL_CONCURRENCY_LIMIT:-16}
      AGENT_USER_CONCURRENCY_LIMIT: ${AGENT_USER_CONCURRENCY_LIMIT:-2}
      TZ: ${TZ:-UTC}
    volumes:
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/agent-service-private.pem:/run/secrets/hotshop/agent-service-private.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/user-public.pem:/run/secrets/hotshop/user-public.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/administrator-public.pem:/run/secrets/hotshop/administrator-public.pem:ro
      - ${HOTSHOP_KEY_DIR:-./.local/keys/hotshop}/agent-delegation-public.pem:/run/secrets/hotshop/agent-delegation-public.pem:ro
    ports:
      - "${AGENT_PORT:-8090}:8090"
    depends_on:
      redis-cache:
        condition: service_healthy
    networks:
      - hotShop-network
    mem_limit: ${AGENT_MEMORY_LIMIT:-512m}
    restart: unless-stopped

volumes:
  mysql_data:
  redis_cache_data:
  redis_seckill_data:
  rabbitmq_data:

networks:
  hotShop-network:
    driver: bridge
