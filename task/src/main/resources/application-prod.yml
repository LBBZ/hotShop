# Production processes share a schema; use distinct least-privilege database users.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db}:${DB_PORT:3306}/${DB_NAME:hotShop_portal_prod}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&serverTimezone=UTC
    username: ${DB_USER:prod_portal}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:prod-redis}
      port: 6379

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
