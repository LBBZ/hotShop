version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-production:
        dependency-type: production
      maven-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      web-production:
        dependency-type: production
      web-development:
        dependency-type: development

  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      agent-production:
        dependency-type: production
      agent-development:
        dependency-type: development
