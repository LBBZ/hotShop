# API cache policy comes from the upstream; hashed build assets are immutable.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream portal-backend {
    zone portal-backend 64k;
    server portal-service:8080 resolve;
}

upstream admin-backend {
    zone admin-backend 64k;
    server admin-service:8088 resolve;
}

upstream agent-backend {
    zone agent-backend 64k;
    server agent-service:8090 resolve;
}

map $uri $hotshop_cache_control {
    default "no-cache";
    ~^/(api|admin/api|agent-api|provider-callbacks)/ "";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $hotshop_cache_control;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /agent-api/ {
        proxy_pass http://agent-backend/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }

    location /admin/api/ {
        proxy_pass http://admin-backend;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://portal-backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }

    location /provider-callbacks/ {
        proxy_pass http://portal-backend;
        proxy_http_version 1.1;
    }

    location /assets/ {
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
