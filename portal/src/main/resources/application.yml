spring:
  application:
    name: portal
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  config:
    import:
      - classpath:config/common-db.yml
      - classpath:config/common-redis.yml
      - classpath:config/common-jwt.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotShop?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

rabbitmq:
  enabled: false

hotshop:
  order:
    legacy-payment-timeout: ${HOTSHOP_LEGACY_ORDER_TIMEOUT:15m}
  mock-payment:
    enabled: ${HOTSHOP_MOCK_PAYMENT_ENABLED:false}
    secret: ${HOTSHOP_MOCK_PAYMENT_SECRET:}
    allowed-clock-skew: ${HOTSHOP_MOCK_PAYMENT_ALLOWED_CLOCK_SKEW:5m}
    callback-url: ${HOTSHOP_MOCK_PAYMENT_CALLBACK_URL:http://portal-service:8080/provider-callbacks/v1/mock-payment}
    http-timeout: ${HOTSHOP_MOCK_PAYMENT_HTTP_TIMEOUT:3s}
    retry-delay: ${HOTSHOP_MOCK_PAYMENT_RETRY_DELAY:2s}
    max-delivery-attempts: ${HOTSHOP_MOCK_PAYMENT_MAX_DELIVERY_ATTEMPTS:5}
    max-simulation-delay: ${HOTSHOP_MOCK_PAYMENT_MAX_SIMULATION_DELAY:1h}
    max-duplicate-count: ${HOTSHOP_MOCK_PAYMENT_MAX_DUPLICATE_COUNT:10}
    max-callback-body-bytes: ${HOTSHOP_MOCK_PAYMENT_MAX_CALLBACK_BODY_BYTES:4096}

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
    version: openapi_3_1

logging:
  level:
    org.springframework.security: INFO
    com.real: INFO
    com.real.domain.mapper: WARN
