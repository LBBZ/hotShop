spring:
  application:
    name: task
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  config:
    import:
      - classpath:config/common-db.yml
      - classpath:config/common-redis.yml
      - classpath:config/common-jwt.yml
      - classpath:config/orderTimeoutConfig.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotShop?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true   # 开启消费重试
          max-attempts: 3 # 最大重试次数

rabbitmq:
  enabled: true

server:
  port: 8888

logging:
  level:
    com.real: TRACE

hotshop:
  seckill:
    order-consumer:
      enabled: ${HOTSHOP_SECKILL_ORDER_CONSUMER_ENABLED:true}
      group-name: ${HOTSHOP_SECKILL_ORDER_GROUP:hotshop-order-v1}
      consumer-prefix: ${HOTSHOP_SECKILL_ORDER_CONSUMER_PREFIX:order}
      read-batch: ${HOTSHOP_SECKILL_ORDER_READ_BATCH:20}
      read-block: ${HOTSHOP_SECKILL_ORDER_READ_BLOCK:2s}
      poll-delay: ${HOTSHOP_SECKILL_ORDER_POLL_DELAY:250ms}
      discovery-interval: ${HOTSHOP_SECKILL_ORDER_DISCOVERY_INTERVAL:10s}
      claim-idle: ${HOTSHOP_SECKILL_ORDER_CLAIM_IDLE:30s}
      claim-batch: ${HOTSHOP_SECKILL_ORDER_CLAIM_BATCH:20}
      retry-initial-backoff: ${HOTSHOP_SECKILL_ORDER_RETRY_INITIAL_BACKOFF:1s}
      retry-max-backoff: ${HOTSHOP_SECKILL_ORDER_RETRY_MAX_BACKOFF:5m}
      retry-multiplier: ${HOTSHOP_SECKILL_ORDER_RETRY_MULTIPLIER:2.0}
      deterministic-failure-attempts: ${HOTSHOP_SECKILL_ORDER_DETERMINISTIC_FAILURE_ATTEMPTS:3}
      order-timeout: ${HOTSHOP_SECKILL_ORDER_TIMEOUT:15m}
      payment-timeout: ${HOTSHOP_SECKILL_PAYMENT_TIMEOUT:15m}
      reconciliation-interval: ${HOTSHOP_SECKILL_RECONCILIATION_INTERVAL:5m}
      reconciliation-batch: ${HOTSHOP_SECKILL_RECONCILIATION_BATCH:100}
      reconciliation-dry-run: ${HOTSHOP_SECKILL_RECONCILIATION_DRY_RUN:true}
      auto-repair: ${HOTSHOP_SECKILL_RECONCILIATION_AUTO_REPAIR:false}
